<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta e comece seu treino agora!">
    <meta name="theme-color" content="#1a1b1d">
    <title>Criar Conta | Cadastro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>
    <div class="signup-container">
        <div class="logo-section">
            <div class="character-preview">
                <img id="characterImg" src="" alt="Personagem selecionado">
            </div>
            <h1 class="academy-name">CRIAR CONTA</h1>
            <p class="academy-subtitle">Comece seu treino hoje</p>
        </div>

        <form id="signupForm" novalidate>
            <div class="error-message" id="errorMessage" role="alert"></div>
            <div class="success-message" id="successMessage" role="status"></div>

            <div class="form-group">
                <label for="name">Nome completo</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Seu nome"
                    required
                    aria-required="true"
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    required
                    aria-required="true"
                >
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Crie uma senha"
                        required
                        aria-required="true"
                    >
                    <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar senha">
                        <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
                <div class="password-hint">Mínimo de 6 caracteres</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar senha</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repita sua senha"
                        required
                        aria-required="true"
                    >
                    <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar senha">
                        <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <div class="terms-group">
                <input type="checkbox" name="terms" id="terms">
                <label for="terms">
                    Concordo com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a>
                </label>
            </div>

            <button type="submit" class="btn-signup" id="submitBtn">Criar conta</button>
        </form>

        <div class="login-section">
            Já tem conta? <a href="login.html">Entrar</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/cadastro.js"></script>
    
    <!-- TESTE TEMPORARIO DE CADASTRO SUPABASE -->
    <div
        id="testeCadastroSupabase"
        style="padding: 16px; margin: 16px;
               background: #202428; color: white;
               border: 1px solid #35e67a;
               border-radius: 10px;"
    >
        <button
            type="button"
            id="btnCadastroSupabase"
        >
            Testar cadastro Supabase
        </button>

        <p id="resultadoCadastroSupabase">
            Teste ainda não realizado.
        </p>
    </div>

    <script>
        document.getElementById('btnCadastroSupabase')
            .addEventListener('click', async () => {
                const resultado = document.getElementById(
                    'resultadoCadastroSupabase'
                );

                const nome = prompt('Nome do usuário de teste:');
                if (nome === null) return;

                const email = prompt('E-mail de teste:');
                if (email === null) return;

                const senha = prompt(
                    'Senha de teste (mínimo de 8 caracteres):'
                );
                if (senha === null) return;

                if (
                    !nome.trim() ||
                    !email.trim() ||
                    senha.length < 8
                ) {
                    resultado.textContent =
                        'Preencha os dados corretamente.';
                    return;
                }

                resultado.textContent =
                    'Enviando cadastro ao Supabase...';

                try {
                    const dados = await cadastrarUsuarioSupabase(
                        nome.trim(),
                        email.trim().toLowerCase(),
                        senha
                    );

                    resultado.textContent = dados.user
                        ? 'Cadastro enviado! Verifique seu e-mail.'
                        : 'Nenhum usuário retornado pelo Supabase.';
                } catch (erro) {
                    resultado.textContent =
                        'Erro: ' + erro.message;
                }
            });
    </script>
</body>
</html>
