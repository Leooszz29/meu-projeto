
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Pré-visualização da Migração | FitZone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101216;
            color: #ffffff;
            margin: 0;
            padding: 24px;
        }

        main {
            max-width: 560px;
            margin: 40px auto;
        }

        h1 {
            color: #e4bd68;
        }

        input {
            display: block;
            margin: 20px 0;
            max-width: 100%;
        }

        #resultado {
            background: #1d222a;
            border-radius: 12px;
            padding: 20px;
            white-space: pre-wrap;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <main>
        <h1>FitZone — Migração</h1>

        <p>
            Selecione o backup tradicional para analisar
            seus dados antes da migração.
        </p>

        <p>
            Esta ferramenta apenas lê o arquivo.
            Nenhum dado será enviado ou alterado.
        </p>

        <input
            type="file"
            id="arquivoBackup"
            accept=".json,application/json"
        >

        <button
            type="button"
            id="exportarPreferencias"
            disabled
        >
            Exportar preferências para migração
        </button>

        <div id="resultado" role="status">
            Nenhum arquivo selecionado.
        </div>
    </main>

    <script>
        const arquivoInput =
            document.getElementById('arquivoBackup');

        const resultado =
            document.getElementById('resultado');

        const botaoExportarPreferencias =
            document.getElementById('exportarPreferencias');

        let preferenciasParaExportar = null;

        botaoExportarPreferencias.addEventListener(
            'click',
            () => {
                if (!preferenciasParaExportar) {
                    return;
                }

                const conteudo = JSON.stringify(
                    preferenciasParaExportar,
                    null,
                    2
                );

                const arquivo = new Blob(
                    [conteudo],
                    { type: 'application/json' }
                );

                const url = URL.createObjectURL(arquivo);
                const link = document.createElement('a');

                link.href = url;
                link.download =
                    'fitzone-preferencias-migracao.json';

                document.body.appendChild(link);
                link.click();
                link.remove();

                URL.revokeObjectURL(url);
            }
        );

        arquivoInput.addEventListener(
            'change',
            async () => {
                const arquivo = arquivoInput.files?.[0];

                if (!arquivo) {
                    return;
                }

                preferenciasParaExportar = null;
                botaoExportarPreferencias.disabled = true;

                resultado.textContent =
                    'Analisando backup...';

                try {
                    if (
                        arquivo.size === 0 ||
                        arquivo.size > 20 * 1024 * 1024
                    ) {
                        throw new Error(
                            'O arquivo deve ter até 20 MB.'
                        );
                    }

                    const texto = await arquivo.text();
                    const backup = JSON.parse(texto);

                    if (
                        !backup ||
                        backup.aplicativo !== 'FitZone' ||
                        backup.versaoBackup !== 1 ||
                        typeof backup.contaEmail !== 'string' ||
                        !backup.contaEmail.trim() ||
                        !backup.dados ||
                        typeof backup.dados !== 'object' ||
                        Array.isArray(backup.dados)
                    ) {
                        throw new Error(
                            'Formato de backup incompatível.'
                        );
                    }

                    const obrigatorias = [
                        'perfil',
                        'fotoPerfil',
                        'treinos',
                        'historico',
                        'progresso',
                        'treinoAtivo',
                        'checkins',
                        'metaMensal'
                    ];

                    const opcionais = [
                        'favoritos',
                        'secoesDesempenho'
                    ];

                    const categorias = [
                        ...obrigatorias,
                        ...opcionais
                    ];

                    if (
                        !obrigatorias.every(
                            chave => Object.hasOwn(
                                backup.dados,
                                chave
                            )
                        ) ||
                        !Object.entries(backup.dados).every(
                            ([chave, valor]) =>
                                categorias.includes(chave) &&
                                (
                                    valor === null ||
                                    typeof valor === 'string'
                                )
                        )
                    ) {
                        throw new Error(
                            'Categorias do backup inválidas.'
                        );
                    }

                    function lerCategoria(nome, tipo) {
                        const valor = backup.dados[nome];

                        if (valor === null || valor === undefined) {
                            return tipo === 'lista' ? [] : null;
                        }

                        const dados = JSON.parse(valor);

                        const valido = tipo === 'lista'
                            ? Array.isArray(dados)
                            : (
                                dados !== null &&
                                typeof dados === 'object' &&
                                !Array.isArray(dados)
                            );

                        if (!valido) {
                            throw new Error(
                                'Dados inválidos: ' + nome
                            );
                        }

                        return dados;
                    }

                    const treinos =
                        lerCategoria('treinos', 'lista');

                    const historico =
                        lerCategoria('historico', 'lista');

                    const treinoAtivo =
                        lerCategoria('treinoAtivo', 'objeto');

                    const progresso =
                        lerCategoria('progresso', 'objeto');

                    const checkins =
                        lerCategoria('checkins', 'objeto');

                    const perfil =
                        lerCategoria('perfil', 'objeto');

                    const favoritos =
                        lerCategoria('favoritos', 'lista');

                    /* =========================================
                       ANALISE DE COMPATIBILIDADE - V1
                       SOMENTE LEITURA
                    ========================================= */

                    const problemas = [];

                    const idsTreinos = new Set();

                    treinos.forEach((treino, indice) => {
                        if (
                            !treino ||
                            typeof treino.id !== 'string' ||
                            !treino.id.trim() ||
                            typeof treino.nome !== 'string' ||
                            !treino.nome.trim() ||
                            !Array.isArray(treino.exercicios)
                        ) {
                            problemas.push(
                                `Treino ${indice + 1}: estrutura inválida`
                            );
                            return;
                        }

                        if (idsTreinos.has(treino.id)) {
                            problemas.push(
                                `Treino ${indice + 1}: ID duplicado`
                            );
                        }

                        idsTreinos.add(treino.id);
                    });

                    const chavesHistorico = new Set();

                    historico.forEach((registro, indice) => {
                        if (
                            !registro ||
                            typeof registro.workoutId !== 'string' ||
                            !registro.workoutId.trim() ||
                            typeof registro.data !== 'string' ||
                            !Number.isFinite(Date.parse(registro.data)) ||
                            !Array.isArray(registro.exercicios)
                        ) {
                            problemas.push(
                                `Histórico ${indice + 1}: estrutura inválida`
                            );
                            return;
                        }

                        const chave = [
                            registro.workoutId,
                            registro.data
                        ].join('|');

                        if (chavesHistorico.has(chave)) {
                            problemas.push(
                                `Histórico ${indice + 1}: registro repetido`
                            );
                        }

                        chavesHistorico.add(chave);
                    });

                    /* =========================================
                       VALIDAR TREINO ATIVO TRADICIONAL
                    ========================================= */

                    if (treinoAtivo) {
                        const treinoCorrespondente = treinos.find(
                            treino => treino.id === treinoAtivo.id
                        );

                        if (
                            typeof treinoAtivo.id !== 'string' ||
                            !treinoAtivo.id.trim() ||
                            typeof treinoAtivo.nome !== 'string' ||
                            !treinoAtivo.nome.trim() ||
                            !treinoCorrespondente
                        ) {
                            problemas.push(
                                'Treino ativo: estrutura incompatível'
                            );
                        }
                    }

                    /* =========================================
                       VALIDAR PROGRESSO DAS SERIES
                       SOMENTE LEITURA
                    ========================================= */

                    let seriesMarcadas = 0;
                    let seriesTreinoAtivo = 0;

                    if (progresso) {
                        Object.entries(progresso).forEach(
                            ([treinoId, exercicios]) => {
                                if (
                                    !exercicios ||
                                    typeof exercicios !== 'object' ||
                                    Array.isArray(exercicios)
                                ) {
                                    problemas.push(
                                        `Progresso inválido: ${treinoId}`
                                    );
                                    return;
                                }

                                Object.entries(exercicios).forEach(
                                    ([exercicioId, series]) => {
                                        if (
                                            !exercicioId ||
                                            !Array.isArray(series) ||
                                            !series.every(
                                                numero =>
                                                    Number.isInteger(numero) &&
                                                    numero >= 1
                                            ) ||
                                            new Set(series).size !==
                                                series.length
                                        ) {
                                            problemas.push(
                                                'Séries inválidas no progresso'
                                            );
                                            return;
                                        }

                                        seriesMarcadas += series.length;

                                        if (
                                            treinoAtivo &&
                                            treinoId === treinoAtivo.id
                                        ) {
                                            seriesTreinoAtivo +=
                                                series.length;
                                        }
                                    }
                                );
                            }
                        );
                    }

                    /* =========================================
                       PREPARAR TREINOS PARA MIGRACAO
                       SOMENTE LEITURA - V1
                    ========================================= */

                    const treinosConvertidos = treinos.map(
                        treino => ({
                            treino_id: treino.id,
                            dados: {
                                ...treino
                            }
                        })
                    );

                    const idsConvertidos = new Set(
                        treinosConvertidos.map(
                            treino => treino.treino_id
                        )
                    );

                    const treinosConvertidosValidos =
                        treinosConvertidos.every(
                            treino =>
                                typeof treino.treino_id === 'string' &&
                                treino.treino_id.trim() !== '' &&
                                treino.dados.id === treino.treino_id &&
                                typeof treino.dados.nome === 'string' &&
                                treino.dados.nome.trim() !== '' &&
                                Array.isArray(
                                    treino.dados.exercicios
                                )
                        ) &&
                        idsConvertidos.size ===
                            treinosConvertidos.length;

                    if (!treinosConvertidosValidos) {
                        problemas.push(
                            'Falha na preparação dos treinos para Supabase'
                        );
                    }

                    /* =========================================
                       PREPARAR HISTORICO PARA SUPABASE
                       SOMENTE LEITURA - V1
                    ========================================= */

                    const historicosConvertidos = [];
                    const chavesConclusoes = new Set();

                    historico.forEach((registro, indice) => {
                        const dataConclusao =
                            new Date(registro.data);

                        if (
                            typeof registro.workoutId !== 'string' ||
                            !registro.workoutId.trim() ||
                            !Number.isFinite(
                                dataConclusao.getTime()
                            )
                        ) {
                            problemas.push(
                                `Histórico ${indice + 1}: conversão inválida`
                            );
                            return;
                        }

                        const ano = dataConclusao.getFullYear();
                        const mes = String(
                            dataConclusao.getMonth() + 1
                        ).padStart(2, '0');

                        const dia = String(
                            dataConclusao.getDate()
                        ).padStart(2, '0');

                        const dataLocal =
                            `${ano}-${mes}-${dia}`;

                        const chaveConclusao = JSON.stringify([
                            registro.workoutId,
                            dataLocal
                        ]);

                        if (chavesConclusoes.has(chaveConclusao)) {
                            problemas.push(
                                `Histórico ${indice + 1}: ` +
                                'mesmo treino concluído ' +
                                'mais de uma vez no mesmo dia'
                            );
                        }

                        chavesConclusoes.add(chaveConclusao);

                        historicosConvertidos.push({
                            treino_id: registro.workoutId,
                            data_local: dataLocal,
                            dados: {
                                ...registro
                            },
                            concluido_em:
                                registro.data
                        });
                    });

                    const historicosConvertidosValidos =
                        historicosConvertidos.length ===
                            historico.length &&
                        historicosConvertidos.every(
                            registro =>
                                typeof registro.treino_id === 'string' &&
                                registro.treino_id.trim() !== '' &&
                                /^\d{4}-\d{2}-\d{2}$/.test(
                                    registro.data_local
                                ) &&
                                registro.dados.workoutId ===
                                    registro.treino_id &&
                                typeof registro.dados.nome === 'string' &&
                                Array.isArray(
                                    registro.dados.exercicios
                                ) &&
                                Number.isFinite(
                                    Date.parse(
                                        registro.concluido_em
                                    )
                                )
                        );

                    if (!historicosConvertidosValidos) {
                        problemas.push(
                            'Falha na preparação do histórico para Supabase'
                        );
                    }

                    /* =========================================
                       PREPARAR TREINO ATIVO PARA SUPABASE
                       SOMENTE LEITURA - V1
                    ========================================= */

                    let treinoAtivoConvertido = null;
                    let seriesAtivasConvertidas = 0;

                    if (treinoAtivo) {
                        const treinoCorrespondente = treinos.find(
                            treino => treino.id === treinoAtivo.id
                        );

                        if (!treinoCorrespondente) {
                            problemas.push(
                                'Treino ativo não encontrado para conversão'
                            );
                        } else {
                            const progressoOriginal =
                                progresso?.[treinoAtivo.id] || {};

                            const progressoConvertido = {};

                            treinoCorrespondente.exercicios.forEach(
                                (exercicio, indice) => {
                                    const chaveExercicio =
                                        exercicio.id ||
                                        `exercise-${indice}`;

                                    const series =
                                        progressoOriginal[chaveExercicio] || [];

                                    const quantidadeSeries =
                                        Number(exercicio.series);

                                    if (
                                        !Array.isArray(series) ||
                                        !Number.isInteger(quantidadeSeries) ||
                                        quantidadeSeries < 1 ||
                                        !series.every(
                                            numero =>
                                                Number.isInteger(numero) &&
                                                numero >= 1 &&
                                                numero <= quantidadeSeries
                                        )
                                    ) {
                                        problemas.push(
                                            'Progresso incompatível no exercício ' +
                                            (indice + 1)
                                        );
                                        return;
                                    }

                                    if (series.length > 0) {
                                        progressoConvertido[chaveExercicio] =
                                            [...series].sort(
                                                (a, b) => a - b
                                            );

                                        seriesAtivasConvertidas +=
                                            series.length;
                                    }
                                }
                            );

                            const chavesExercicios = new Set(
                                treinoCorrespondente.exercicios.map(
                                    (exercicio, indice) =>
                                        exercicio.id ||
                                        `exercise-${indice}`
                                )
                            );

                            Object.keys(progressoOriginal).forEach(
                                chave => {
                                    if (!chavesExercicios.has(chave)) {
                                        problemas.push(
                                            'Progresso sem exercício correspondente'
                                        );
                                    }
                                }
                            );

                            treinoAtivoConvertido = {
                                treino_id: treinoAtivo.id,
                                treino_nome: treinoAtivo.nome,
                                progresso: progressoConvertido
                            };
                        }
                    }

                    const treinoAtivoConvertidoValido =
                        treinoAtivo === null ||
                        (
                            treinoAtivoConvertido !== null &&
                            treinoAtivoConvertido.treino_id ===
                                treinoAtivo.id &&
                            seriesAtivasConvertidas ===
                                seriesTreinoAtivo
                        );

                    if (!treinoAtivoConvertidoValido) {
                        problemas.push(
                            'Falha na conversão do treino ativo'
                        );
                    }

                    /* =========================================
                       VALIDAR DADOS COMPLEMENTARES
                       SOMENTE LEITURA - V1
                    ========================================= */

                    const checkinsValidos =
                        !checkins ||
                        Object.entries(checkins).every(
                            ([data, registro]) => {
                                if (
                                    !/^\d{4}-\d{2}-\d{2}$/.test(data)
                                ) {
                                    return false;
                                }

                                const [ano, mes, dia] =
                                    data.split('-').map(Number);

                                const dataVerificada = new Date(
                                    Date.UTC(ano, mes - 1, dia)
                                );

                                return (
                                    dataVerificada.getUTCFullYear() === ano &&
                                    dataVerificada.getUTCMonth() === mes - 1 &&
                                    dataVerificada.getUTCDate() === dia &&
                                    registro !== null &&
                                    typeof registro === 'object' &&
                                    !Array.isArray(registro) &&
                                    typeof registro.checked === 'boolean' &&
                                    typeof registro.treino === 'string'
                                );
                            }
                        );

                    if (!checkinsValidos) {
                        problemas.push(
                            'Check-ins: estrutura incompatível'
                        );
                    }

                    const valorMetaMensal =
                        backup.dados.metaMensal;

                    const metaMensalValida =
                        valorMetaMensal === null ||
                        (
                            valorMetaMensal.trim() !== '' &&
                            Number.isInteger(
                                Number(valorMetaMensal)
                            ) &&
                            Number(valorMetaMensal) >= 1 &&
                            Number(valorMetaMensal) <= 100
                        );

                    if (!metaMensalValida) {
                        problemas.push(
                            'Meta mensal: valor incompatível'
                        );
                    }

                    const favoritosValidos =
                        favoritos.every(
                            favorito =>
                                typeof favorito === 'string' &&
                                favorito.trim() !== ''
                        ) &&
                        new Set(favoritos).size ===
                            favoritos.length;

                    if (!favoritosValidos) {
                        problemas.push(
                            'Favoritos: estrutura incompatível'
                        );
                    }

                    let secoesDesempenhoValidas = true;

                    if (
                        backup.dados.secoesDesempenho !== null &&
                        backup.dados.secoesDesempenho !== undefined
                    ) {
                        try {
                            const secoes = JSON.parse(
                                backup.dados.secoesDesempenho
                            );

                            secoesDesempenhoValidas =
                                secoes !== null &&
                                typeof secoes === 'object' &&
                                !Array.isArray(secoes);

                        } catch (erro) {
                            secoesDesempenhoValidas = false;
                        }
                    }

                    if (!secoesDesempenhoValidas) {
                        problemas.push(
                            'Preferências visuais: estrutura incompatível'
                        );
                    }

                    const dadosComplementaresValidos =
                        checkinsValidos &&
                        metaMensalValida &&
                        favoritosValidos &&
                        secoesDesempenhoValidas;

                    /* =========================================
                       VALIDAR PERFIL E FOTO
                       SOMENTE LEITURA - V1
                    ========================================= */

                    const camposPerfil = [
                        'nome',
                        'idade',
                        'tipoSanguineo',
                        'peso',
                        'altura',
                        'treinador',
                        'infoPessoais'
                    ];

                    const perfilValido =
                        perfil === null ||
                        (
                            camposPerfil.every(
                                campo =>
                                    !Object.hasOwn(perfil, campo) ||
                                    typeof perfil[campo] === 'string'
                            ) &&
                            (
                                !Object.hasOwn(perfil, 'nome') ||
                                perfil.nome.trim().length > 0
                            )
                        );

                    if (!perfilValido) {
                        problemas.push(
                            'Perfil: dados incompatíveis'
                        );
                    }

                    const fotoOriginal =
                        backup.dados.fotoPerfil;

                    const fotoValida =
                        fotoOriginal === null ||
                        (
                            typeof fotoOriginal === 'string' &&
                            /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(
                                fotoOriginal
                            )
                        );

                    if (!fotoValida) {
                        problemas.push(
                            'Foto do perfil: formato incompatível'
                        );
                    }

                    const fotoPresente =
                        fotoOriginal !== null &&
                        fotoOriginal !== undefined;

                    const perfilFotoValidos =
                        perfilValido && fotoValida;

                    /* =========================================
                       AUDITORIA DE DADOS NAO COBERTOS
                       SOMENTE LEITURA - V1
                    ========================================= */

                    const dadosNaoIncluidos = [
                        'Gênero e tema visual',
                        'Preferências do usuário'
                    ];

                    /* =========================================
                       LOCALIZAR PREFERENCIAS TRADICIONAIS
                       SOMENTE LEITURA - V1
                    ========================================= */

                    const emailBackup =
                        backup.contaEmail.trim().toLowerCase();

                    const generoLocal = localStorage.getItem(
                        `generoFitZone:${emailBackup}`
                    );

                    const generoLocalValido =
                        generoLocal === 'masculino' ||
                        generoLocal === 'feminino';

                    const preferenciasLocais = localStorage.getItem(
                        `fitzonePreferencias:${emailBackup}`
                    );

                    let preferenciasLocaisValidas = false;

                    if (preferenciasLocais !== null) {
                        try {
                            const dadosPreferencias =
                                JSON.parse(preferenciasLocais);

                            preferenciasLocaisValidas =
                                dadosPreferencias !== null &&
                                typeof dadosPreferencias === 'object' &&
                                !Array.isArray(dadosPreferencias);

                        } catch (erro) {
                            preferenciasLocaisValidas = false;
                        }
                    }

                    /* =========================================
                       PREPARAR PREFERENCIAS PARA MIGRACAO
                       SOMENTE LEITURA - V1
                    ========================================= */

                    let preferenciasConvertidas = null;
                    let preferenciasFormatoValido = false;

                    if (preferenciasLocaisValidas) {
                        const dadosPreferencias =
                            JSON.parse(preferenciasLocais);

                        const paginasPermitidas = [
                            'calendario.html',
                            'treinos.html',
                            'desempenho.html'
                        ];

                        preferenciasFormatoValido =
                            (
                                dadosPreferencias.mensagensMotivacionais ===
                                    undefined ||
                                typeof dadosPreferencias.mensagensMotivacionais ===
                                    'boolean'
                            ) &&
                            (
                                dadosPreferencias.paginaInicial ===
                                    undefined ||
                                paginasPermitidas.includes(
                                    dadosPreferencias.paginaInicial
                                )
                            );

                        if (preferenciasFormatoValido) {
                            preferenciasConvertidas = {
                                genero: generoLocalValido
                                    ? generoLocal
                                    : null,
                                mensagensMotivacionais:
                                    dadosPreferencias.mensagensMotivacionais
                                        ?? true,
                                paginaInicial:
                                    dadosPreferencias.paginaInicial
                                        ?? 'calendario.html'
                            };
                        }
                    }

                    const idsProgresso = progresso
                        ? Object.keys(progresso)
                        : [];

                    const outrosProgressos = idsProgresso.filter(
                        treinoId =>
                            !treinoAtivo ||
                            treinoId !== treinoAtivo.id
                    );

                    const seriesOutrosTreinos =
                        outrosProgressos.reduce(
                            (total, treinoId) => {
                                const exercicios =
                                    progresso[treinoId];

                                if (
                                    !exercicios ||
                                    typeof exercicios !== 'object' ||
                                    Array.isArray(exercicios)
                                ) {
                                    return total;
                                }

                                return total + Object.values(
                                    exercicios
                                ).reduce(
                                    (subtotal, series) =>
                                        subtotal +
                                        (
                                            Array.isArray(series)
                                                ? series.length
                                                : 0
                                        ),
                                    0
                                );
                            },
                            0
                        );

                    const resumoCompatibilidade =
                        problemas.length === 0
                            ? 'Nenhuma incompatibilidade inicial encontrada.'
                            : [
                                `${problemas.length} possível(is) incompatibilidade(s):`,
                                ...problemas.slice(0, 10),
                                problemas.length > 10
                                    ? 'Existem outras ocorrências.'
                                    : ''
                            ].filter(Boolean).join('\n');

                    const data = Number.isFinite(
                        Date.parse(backup.exportadoEm)
                    )
                        ? new Date(
                            backup.exportadoEm
                        ).toLocaleDateString('pt-BR')
                        : 'Não identificada';

                    if (
                        problemas.length === 0 &&
                        preferenciasConvertidas &&
                        preferenciasConvertidas.genero !== null
                    ) {
                        preferenciasParaExportar = {
                            aplicativo: 'FitZone',
                            tipo: 'preferencias-migracao',
                            versao: 1,
                            contaEmail: emailBackup,
                            exportadoEm:
                                new Date().toISOString(),
                            preferencias: {
                                ...preferenciasConvertidas
                            }
                        };

                        botaoExportarPreferencias.disabled = false;
                    }

                    resultado.textContent = [
                        'ANÁLISE INICIAL CONCLUÍDA',
                        '',
                        'Data do backup: ' + data,
                        'Treinos: ' + treinos.length,
                        'Histórico: ' + historico.length,
                        'Treino ativo: ' +
                            (treinoAtivo ? 'Sim' : 'Não'),
                        'Check-ins registrados: ' +
                            (checkins
                                ? Object.keys(checkins).length
                                : 0),
                        'Perfil: ' +
                            (perfil ? 'Presente' : 'Ausente'),
                        'Favoritos: ' + favoritos.length,
                        'Séries marcadas no backup: ' +
                            seriesMarcadas,
                        'Séries do treino ativo: ' +
                            seriesTreinoAtivo,
                        '',
                        'PREPARAÇÃO PARA SUPABASE',
                        'Treinos preparados: ' +
                            treinosConvertidos.length,
                        'Estrutura dos treinos: ' +
                            (
                                treinosConvertidosValidos
                                    ? 'Válida'
                                    : 'Incompatível'
                            ),
                        'Históricos preparados: ' +
                            historicosConvertidos.length,

                        'Estrutura do histórico: ' +
                            (
                                historicosConvertidosValidos
                                    ? 'Válida'
                                    : 'Incompatível'
                            ),
                        'Treino ativo preparado: ' +
                            (
                                treinoAtivoConvertido
                                    ? 'Sim'
                                    : 'Não'
                            ),
                        'Séries preservadas na conversão: ' +
                            seriesAtivasConvertidas,

                        'Estrutura do treino ativo: ' +
                            (
                                treinoAtivoConvertidoValido
                                    ? 'Válida'
                                    : 'Incompatível'
                            ),
                        '',
                        'DADOS COMPLEMENTARES',
                        'Check-ins: ' +
                            (checkinsValidos ? 'Válidos' : 'Incompatíveis'),
                        'Meta mensal: ' +
                            (metaMensalValida ? 'Válida' : 'Incompatível'),
                        'Favoritos: ' +
                            (favoritosValidos ? 'Válidos' : 'Incompatíveis'),
                        'Preferências visuais: ' +
                            (
                                secoesDesempenhoValidas
                                    ? 'Válidas'
                                    : 'Incompatíveis'
                            ),

                        'Validação complementar: ' +
                            (
                                dadosComplementaresValidos
                                    ? 'Aprovada'
                                    : 'Requer correção'
                            ),
                        '',
                        'PERFIL E FOTO',
                        'Perfil: ' +
                            (perfilValido ? 'Válido' : 'Incompatível'),
                        'Foto personalizada: ' +
                            (fotoPresente ? 'Presente' : 'Ausente'),
                        'Formato da foto: ' +
                            (fotoValida ? 'Válido' : 'Incompatível'),
                        'Validação do perfil e foto: ' +
                            (
                                perfilFotoValidos
                                    ? 'Aprovada'
                                    : 'Requer correção'
                            ),
                        '',

                        'AUDITORIA DE DADOS PENDENTES',
                        'Informações fora do backup: ' +
                            dadosNaoIncluidos.join(', '),

                        'Séries de outros treinos: ' +
                            seriesOutrosTreinos,
                        'Gênero neste navegador: ' +
                            (
                                generoLocalValido
                                    ? 'Encontrado'
                                    : 'Não localizado'
                            ),
                        'Preferências neste navegador: ' +
                            (
                                preferenciasLocaisValidas
                                    ? 'Encontradas'
                                    : 'Não localizadas'
                            ),

                        'Formato das preferências: ' +
                            (
                                preferenciasFormatoValido
                                    ? 'Válido'
                                    : 'Requer verificação'
                            ),
                        'Preferências preparadas: ' +
                            (
                                preferenciasConvertidas
                                    ? 'Sim'
                                    : 'Não'
                            ),
                        'Página inicial: ' +
                            (
                                preferenciasConvertidas?.paginaInicial
                                    || 'Não identificada'
                            ),
                        'Mensagens motivacionais: ' +
                            (
                                preferenciasConvertidas
                                    ? (
                                        preferenciasConvertidas
                                            .mensagensMotivacionais
                                            ? 'Ativadas'
                                            : 'Desativadas'
                                    )
                                    : 'Não identificadas'
                            ),

                        'Situação: requer tratamento antes da migração',

                        '',

                        'COMPATIBILIDADE INICIAL',

                        resumoCompatibilidade,
                        '',
                        'Nenhum dado foi alterado.',
                        '',
                        'Esta é uma análise preliminar.',
                        'A compatibilidade completa ainda',
                        'precisa ser verificada.'
                    ].join('\n');

                } catch (erro) {
                    resultado.textContent =
                        'Não foi possível analisar o backup.\n' +
                        erro.message;
                }
            }
        );
    </script>
</body>
</html>
