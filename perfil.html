<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Complete seu perfil de treino.">
<meta name="theme-color" content="#1a1b1d">
<title>Meu Perfil</title>

<link rel="stylesheet" href="css/perfil.css">
</head>
<body>

<div class="page">
    <header>
        <div class="character-preview">
            <img id="characterImg" src="" alt="Personagem selecionado" style="display:none;">
        </div>
        <h1>MEU PERFIL</h1>
        <p class="subtitle">Preencha seus dados para personalizar seu treino</p>
    </header>

    <div class="form-card">
        <div class="success-message" id="successMessage">Perfil salvo com sucesso! 💪</div>

        <form id="profileForm">
            <div class="form-section-title">Dados pessoais</div>

            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome">
            </div>

            <div class="field-row">
                <div class="form-group">
                    <label for="idade">Idade</label>
                    <input type="number" id="idade" min="0" placeholder="Ex: 28">
                </div>
                <div class="form-group">
                    <label for="tipoSanguineo">Tipo sanguíneo</label>
                    <select id="tipoSanguineo">
                        <option value="">Selecione</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
            </div>

            <div class="form-section-title">Medidas</div>

            <div class="field-row">
                <div class="form-group">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" min="0" step="0.1" placeholder="Ex: 72.5">
                </div>
                <div class="form-group">
                    <label for="altura">Altura (cm)</label>
                    <input type="number" id="altura" min="0" placeholder="Ex: 175">
                </div>
            </div>

            <div class="form-section-title">Treinamento</div>

            <div class="form-group">
                <label for="treinador">Nome do professor/treinador</label>
                <input type="text" id="treinador" placeholder="Nome do seu treinador">
            </div>

            <div class="form-group">
                <label for="infoPessoais">Informações pessoais</label>
                <textarea id="infoPessoais" placeholder="Objetivos, restrições, observações gerais..."></textarea>
            </div>

            <button type="submit" class="btn-save-profile">Salvar perfil</button>
        </form>

        <div class="continue-section">
            <a href="treinos.html" class="continue-link">Ir para meus treinos →</a>
        </div>
    </div>

    <button class="btn-end-session" id="btnEndSession">Finalizar sessão</button>
</div>

<script src="js/perfil.js"></script>
</body>
</html>
