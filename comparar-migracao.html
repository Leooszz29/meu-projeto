<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="theme-color"
        content="#101418"
    >
    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>FitZone — Migração Encerrada</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #101418;
            color: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        main {
            width: 100%;
            max-width: 480px;
            padding: 32px 24px;
            background: #1b2229;
            border: 1px solid #303b45;
            border-radius: 18px;
            text-align: center;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 28px;
        }

        p {
            color: #c4cbd1;
            line-height: 1.6;
        }

        .status {
            color: #69d99a;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 24px;
            background: #28a86b;
            color: #ffffff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main>
        <h1>FitZone</h1>

        <p class="status">
            Migração de contas encerrada
        </p>

        <p>
            Esta ferramenta foi desativada
            após a conclusão da migração.
        </p>

        <p>
            Por segurança, não é mais possível
            importar ou modificar dados
            através desta página.
        </p>

        <p>
            Seus treinos e históricos existentes
            não são alterados por esta mudança.
        </p>

        <a href="treinos.html">
            Acessar Meus Treinos
        </a>
    </main>
</body>
</html>
