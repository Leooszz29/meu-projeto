<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecione o seu gênero</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="arena" id="arena">
  <div class="wall"></div>
  <div class="floor"></div>
  <div class="vignette"></div>

 <div class="content">

    <h1>Selecione o seu gênero</h1>

    <div class="arena-floor">

        <!-- MASCULINO -->

        <div
            class="station"
            id="station-homem"
            onclick="escolherGenero('masculino')"
        >

            <div class="spotlight"></div>

            <div class="ring"></div>

            <div class="lifter-wrap" id="lift-homem">

                <img
                    class="lifter-img"
                    src="img/atleta-masculino.png"
                    alt="Atleta masculino"
                >

                <div class="platform"></div>

            </div>

        </div>


        <!-- FEMININO -->

        <div
            class="station"
            id="station-mulher"
            onclick="escolherGenero('feminino')"
        >

            <div class="spotlight"></div>

            <div class="ring"></div>

            <div class="lifter-wrap" id="lift-mulher">

                <img
                    class="lifter-img"
                    src="img/atleta-feminino.png"
                    alt="Atleta feminino"
                >

                <div class="platform"></div>

            </div>

        </div>

    </div>

</div>

<script src="js/script.js"></script>
</body>
</html>
