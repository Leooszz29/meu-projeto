<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecione o seu gênero</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="arena" id="arena">
  <div class="wall"></div>
  <div class="floor"></div>
  <div class="vignette"></div>

 <div class="content">

    <h1>Selecione o seu gênero</h1>


    <div class="arena-floor">

        <!-- MASCULINO -->
        <button
            type="button"
            class="station"
            id="station-homem"
            aria-label="Selecionar gênero masculino"
            onclick="escolherGenero('masculino')"
        >
            <span class="spotlight" aria-hidden="true"></span>

            <span class="ring" aria-hidden="true"></span>

            <span class="lifter-wrap" id="lift-homem">
                <img
                    class="lifter-img"
                    src="img/atleta-masculino.webp"
                    alt=""
                >

                <span class="platform" aria-hidden="true"></span>
            </span>
        </button>

        <!-- FEMININO -->
        <button
            type="button"
            class="station"
            id="station-mulher"
            aria-label="Selecionar gênero feminino"
            onclick="escolherGenero('feminino')"
        >
            <span class="spotlight" aria-hidden="true"></span>

            <span class="ring" aria-hidden="true"></span>

            <span class="lifter-wrap" id="lift-mulher">
                <img
                    class="lifter-img"
                    src="img/atleta-feminino.webp"
                    alt=""
                >

                <span class="platform" aria-hidden="true"></span>
            </span>
        </button>

    </div>

</div>

<div
    id="fitzoneUpdateNotice"
    class="fitzone-update-notice"
    role="status"
    aria-live="polite"
    hidden
>
    <p>Uma nova versão do FitZone está disponível.</p>

    <button
        type="button"
        id="fitzoneUpdateNow"
    >
        Atualizar agora
    </button>

    <button
        type="button"
        id="fitzoneUpdateLater"
    >
        Atualizar depois
    </button>
</div>

<script src="js/script.js"></script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const avisoAtualizacao = document.getElementById('fitzoneUpdateNotice');
            const botaoAtualizarDepois = document.getElementById('fitzoneUpdateLater');

            if (avisoAtualizacao && botaoAtualizarDepois) {
                botaoAtualizarDepois.addEventListener('click', () => {
                    avisoAtualizacao.hidden = true;
                });
            }
            navigator.serviceWorker.register('./sw.js')
                .then((registro) => {
                    if (registro.waiting && navigator.serviceWorker.controller) {
                        console.info('FitZone: atualização disponível.');

                        const aviso = document.getElementById('fitzoneUpdateNotice');

                        if (aviso) {
                            aviso.hidden = false;
                        }
                    }
                    registro.addEventListener('updatefound', () => {
                        const novoWorker = registro.installing;

                        if (!novoWorker) {
                            return;
                        }

                        novoWorker.addEventListener('statechange', () => {
                            if (
                                novoWorker.state === 'installed' &&
                                navigator.serviceWorker.controller
                            ) {
                                console.info(
                                    'FitZone: nova versão instalada e aguardando ativação.'
                                );

                                const aviso = document.getElementById('fitzoneUpdateNotice');

                                if (aviso) {
                                    aviso.hidden = false;
                                }
                            }
                        });
                    });

                    registro.update().catch((erro) => {
                        console.warn(
                            'Não foi possível verificar atualizações do FitZone:',
                            erro
                        );
                    });
                })
                .catch((erro) => {
                    console.warn(
                        'Não foi possível registrar o service worker:',
                        erro
                    );
                });
        });
    }
</script>

</body>
</html>
