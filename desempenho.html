<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Acompanhe seu desempenho e histórico de treinos."
    >
    <title>Meu Desempenho | FitZone</title>
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>

<div class="page">

    <nav class="app-nav" aria-label="Navegação principal">

        <div class="app-nav-brand">
            FITZONE
        </div>

        <div class="app-nav-actions">

            <a href="perfil.html" class="app-nav-link">
                Perfil
            </a>

            <a href="treinos.html" class="app-nav-link">
                Treinos
            </a>

            <a
                href="desempenho.html"
                class="app-nav-link active"
                aria-current="page"
            >
                Desempenho
            </a>

            <button
                type="button"
                class="btn-end-session"
                id="btnEndSession"
            >
                Sair
            </button>

        </div>

    </nav>

    <header>
        <div class="page-heading">
            <span class="page-eyebrow">
                ÁREA DO ATLETA
            </span>

            <h1>MEU DESEMPENHO</h1>

            <p class="subtitle">
                Acompanhe sua evolução e seu histórico de treinos.
            </p>
        </div>
        </header>

    <!-- RESUMO DO DESEMPENHO -->
    <section class="training-summary">

        <div class="summary-header">
            <span class="summary-eyebrow">EVOLUÇÃO</span>
            <h2>Meu desempenho</h2>
            <p>Acompanhe sua consistência nos treinos.</p>
        </div>

        <div class="summary-grid">

            <div class="summary-card">
                <span class="summary-value" id="totalWorkouts">0</span>
                <span class="summary-label">Treinos concluídos</span>
            </div>

            <div class="summary-card">
                <span class="summary-value" id="currentMonthWorkouts">0</span>
                <span class="summary-label">Neste mês</span>
            </div>

            <div class="summary-card">
                <span class="summary-value" id="lastWorkout">—</span>
                <span class="summary-workout-name" id="lastWorkoutName">—</span>
                <span class="summary-label">Último treino</span>
            </div>

        </div>

    </section>

</div>

<script src="js/desempenho.js"></script>

</body>
</html>
