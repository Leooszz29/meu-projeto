<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Seja bem vindo. Faça seu login e comece seu treino agora!">
    <meta name="theme-color" content="#1a1b1d">
    <title>Seja Bem Vindo | Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="character-preview">
                <img id="characterImg" src="" alt="Personagem selecionado" style="display:none;">
            </div>
            <h1 class="academy-name">SEJA BEM VINDO</h1>
        </div>

        <form id="loginForm" novalidate>
            <div class="error-message" id="errorMessage" role="alert"></div>
            <div class="success-message" id="successMessage" role="status"></div>

            <div class="form-group">
                <label for="email">Email</label>
            <input
    type="email"
    id="email"
    name="email"
    placeholder="seu@email.com"
    autocomplete="email"
    required
    aria-required="true"
>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <div class="password-field">
                    <input
    type="password"
    id="password"
    name="password"
    placeholder="Digite sua senha"
    autocomplete="current-password"
    required
    aria-required="true"
>
                    <button
    type="button"
    class="toggle-password"
    id="togglePassword"
    aria-label="Mostrar senha"
    aria-pressed="false"
>
                        <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-eye-off is-hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" name="remember" id="remember">
                    <span>Lembrar de mim</span>
                </label>
                <button
    type="button"
    class="forgot-password"
    id="forgotPasswordBtn"
>
    Esqueceu a senha?
</button>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">Entrar</button>
        </form>

        <div class="signup-section">
            Ainda não tem conta? <a href="cadastro.html">Cadastre-se aqui</a>
        </div>
        
        </div>
        <!-- Modal Recuperar Senha -->
<div
    class="password-recovery-overlay"
    id="passwordRecoveryOverlay"
    aria-hidden="true"
>
    <div
        class="password-recovery-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="passwordRecoveryTitle"
    >
        <button
            type="button"
            class="password-recovery-close"
            id="passwordRecoveryClose"
            aria-label="Fechar"
        >
            ×
        </button>

        <h2 id="passwordRecoveryTitle">
            Recuperar senha
        </h2>

        <p>
            Informe o e-mail utilizado no seu cadastro.
        </p>

        <div class="form-group">
            <label for="recoveryEmail">
                Email
            </label>

            <input
                type="email"
                id="recoveryEmail"
                placeholder="seu@email.com"
                autocomplete="email"
            >
        </div>

        <div
            class="error-message"
            id="recoveryError"
            role="alert"
        ></div>

        <button
            type="button"
            class="btn-login"
            id="recoveryContinueBtn"
        >
            Continuar
        </button>
    </div>
</div>
    
    <!-- Modal Código de Recuperação -->
<div
    class="password-recovery-overlay"
    id="recoveryCodeOverlay"
    aria-hidden="true"
>
    <div
        class="password-recovery-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="recoveryCodeTitle"
    >
        <button
            type="button"
            class="password-recovery-close"
            id="recoveryCodeClose"
            aria-label="Fechar"
        >
            ×
        </button>

        <h2 id="recoveryCodeTitle">
            Verifique seu e-mail
        </h2>

        <p>
            Enviamos um código de recuperação para o e-mail informado.
            Digite o código abaixo para continuar.
        </p>

        <div class="form-group">
            <label for="recoveryCode">
                Código de recuperação
            </label>

            <input
                type="text"
                id="recoveryCode"
                inputmode="numeric"
                maxlength="6"
                placeholder="000000"
                autocomplete="one-time-code"
            >
        </div>

        <div
            class="error-message"
            id="recoveryCodeError"
            role="alert"
        ></div>

        <button
            type="button"
            class="btn-login"
            id="verifyRecoveryCodeBtn"
        >
            Verificar código
        </button>
    </div>
</div>

    <script src="js/login.js"></script>
</body>
</html>
